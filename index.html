<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardianes de la selva | Documental interactivo</title><link rel="icon" type="image/png" href="murcielago.png">
<style>
:root{--bg:#071f20;--panel:#123534;--mint:#b9dc82;--cream:#f4efda;--gold:#f5cb72}*{box-sizing:border-box}body{margin:0;position:relative;overflow-x:hidden;background:radial-gradient(circle at 80% 10%,#245144,var(--bg) 55%);color:var(--cream);font-family:system-ui,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.78;background-image:radial-gradient(circle at 8% 14%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 22% 68%,#f5cb72 0 1px,transparent 2px),radial-gradient(circle at 37% 26%,#fff 0 1px,transparent 2px),radial-gradient(circle at 52% 82%,#b9dc82 0 1px,transparent 2px),radial-gradient(circle at 66% 18%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 78% 58%,#f5cb72 0 1px,transparent 2px),radial-gradient(circle at 91% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 14% 91%,#b9dc82 0 1px,transparent 2px),radial-gradient(circle at 46% 48%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 86% 88%,#fff9 0 1px,transparent 2px);animation:twinkle 6s ease-in-out infinite alternate}header,main,footer{position:relative;z-index:1}header,main,footer{max-width:1050px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:none;width:100%;background:rgba(3,20,21,.9);padding-left:max(22px,calc((100% - 1050px)/2));padding-right:max(22px,calc((100% - 1050px)/2));border-bottom:1px solid #31574d}header strong{color:var(--mint)}nav{display:flex;gap:10px;flex-wrap:wrap}button{background:var(--mint);border:0;border-radius:13px;padding:12px 18px;color:#102a22;font-weight:750;cursor:pointer;transition:background-color .2s ease,color .2s ease,filter .2s ease,transform .2s ease,box-shadow .2s ease}button:hover{background:#d7f39b;color:#102a22;transform:translateY(-1px);box-shadow:0 6px 14px #0004}button.secondary:hover{background:#5f8d75;color:#fff;border-color:#b9dc82}button.nav-selected{background:var(--gold);color:#102a22;border-color:var(--gold);box-shadow:0 0 0 3px #f5cb7240,0 0 20px #f5cb7255}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.secondary{background:#294b45;color:white;border:1px solid #658879}button:active,button.is-active{background:var(--gold);color:#102a22;transform:translateY(1px);box-shadow:none}button:disabled{cursor:not-allowed;opacity:.55;transform:none;box-shadow:none}h1{font-size:clamp(2.3rem,6vw,4.5rem);line-height:1.06;margin:16px 0}h2{font-size:clamp(1.6rem,3vw,2.4rem)}p{line-height:1.65}.hero{padding:35px 0 55px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px}.hero-art{text-align:center;filter:drop-shadow(0 20px 35px #0008)}.hero-art img{display:block;width:min(125%,520px);max-width:none;margin:auto}.panel{background:#102f2de8;border:1px solid #547968;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 15px 45px #0004}
#doc{height:calc(100vh - 190px);min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-top:10px;padding-bottom:10px;position:relative}#doc:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.72;background-image:radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 24% 76%,#f5cb72 0 1px,transparent 2px),radial-gradient(circle at 43% 32%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 61% 84%,#b9dc82 0 1px,transparent 2px),radial-gradient(circle at 78% 22%,#fff 0 1px,transparent 2px),radial-gradient(circle at 92% 65%,#f5cb72 0 1px,transparent 2px);animation:twinkle 6s ease-in-out infinite alternate}#doc>*{position:relative;z-index:1}#doc>h2{margin:0 0 10px;font-size:clamp(1.6rem,3.4vw,2.7rem)}.scene{height:clamp(360px,45vh,470px);display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;align-items:stretch;background:transparent;padding:0}.scene-card{height:100%;min-height:0;overflow:hidden;border-radius:22px;border:1px solid #547968;background:linear-gradient(145deg,#143a36f2,#0d2929f2);box-shadow:0 14px 32px #0006,0 0 0 1px #ffffff08 inset}.scene-visual-card{padding:0}.scene-visual-card .visual{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle,#4e7b52,#173d35 60%,#0a2427)}.scene-visual-card .visual:before{content:'✦  ✧  ✦';position:absolute;top:25px;left:20px;color:var(--gold);letter-spacing:25px;z-index:1}.scene-image{width:100%;height:100%;object-fit:cover;display:block}.scene-content-card{display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,3vw,34px)}.scene-content-card h2{font-size:clamp(1.35rem,2.5vw,2.25rem);line-height:1.1;margin:0 0 12px}.scene-content-card p{font-size:clamp(.88rem,1.25vw,1.08rem);line-height:1.4;margin:0 0 12px}.fact{background:#21463d;border-radius:15px;padding:12px;font-size:clamp(.82rem,1.1vw,1rem);line-height:1.35}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.scene .controls{margin-top:20px}.scene .controls button{padding:9px 12px;font-size:.88rem}.progress{height:8px;background:#31574d;border-radius:20px;overflow:hidden;margin-bottom:18px}.progress div{height:100%;width:0;background:var(--mint);transition:width 520ms cubic-bezier(.22,.8,.25,1);box-shadow:0 0 12px #b9dc8288}.scene.is-leaving.direction-next .scene-card{animation:sceneOutNext 260ms cubic-bezier(.4,0,.8,1) both}.scene.is-leaving.direction-prev .scene-card{animation:sceneOutPrev 260ms cubic-bezier(.4,0,.8,1) both}.scene.is-entering.direction-next .scene-card{animation:sceneInNext 260ms cubic-bezier(.2,.8,.25,1) both}.scene.is-entering.direction-prev .scene-card{animation:sceneInPrev 260ms cubic-bezier(.2,.8,.25,1) both}@keyframes sceneOutNext{to{opacity:0;transform:translateX(-28px) scale(.985)}}@keyframes sceneOutPrev{to{opacity:0;transform:translateX(28px) scale(.985)}}@keyframes sceneInNext{from{opacity:0;transform:translateX(28px) scale(1.015)}to{opacity:1;transform:none}}@keyframes sceneInPrev{from{opacity:0;transform:translateX(-28px) scale(1.015)}to{opacity:1;transform:none}}@keyframes twinkle{0%{opacity:.42;transform:scale(1)}50%{opacity:.9}100%{opacity:.58;transform:scale(1.015)}}.hidden{display:none!important}footer{font-size:.85rem;color:#b8c6b8}#game{width:100%;height:calc(100vh - 190px);padding:0;overflow:hidden}#gameFrame{display:block;width:100%;height:100%;border:0;border-radius:20px;background:#081814;overflow:hidden}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.hero{grid-template-columns:1fr}.scene{height:auto;grid-template-columns:1fr;gap:16px}.scene-card{height:auto;min-height:260px}.scene-visual-card{height:clamp(250px,48vh,380px)}.scene-content-card{min-height:280px}.scene-content-card .controls{margin-top:auto}#doc{height:auto;min-height:calc(100vh - 190px);overflow:visible}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>
/* Layout responsivo del documental: ocupa el viewport restante sin franjas vacías. */
html,body{min-height:100%;height:100%;}
body{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
main{width:100%;max-width:none;flex:1 1 auto;min-height:0;padding:0 22px 22px;}
#home{max-width:1050px;margin:auto}
#doc{width:100%;max-width:1508px;height:100%;min-height:0;margin:0 auto;padding:clamp(18px,5vh,56px) 0 0;display:grid;grid-template-rows:auto 8px minmax(0,1fr);row-gap:18px;overflow:hidden}
#doc>h2{margin:0;font-size:clamp(2rem,4vw,3.9rem);line-height:1.08}
#doc .progress{width:100%;height:8px;margin:0;border-radius:20px;overflow:hidden;background:#31574d}
#doc .progress div{height:100%;background:var(--mint);transition:width 520ms cubic-bezier(.22,.8,.25,1);box-shadow:0 0 12px #b9dc8288}
#doc .scene{height:auto;min-height:0;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px}
#doc .scene-card{height:100%;min-height:0}
#doc .scene-visual-card .visual,#doc .scene-image,#doc .scene-video{height:100%;min-height:0}
.scene-video{width:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}.scene-video.hidden{display:none}
@media(max-width:700px){
  html,body{height:auto;min-height:100%}
  body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto}
  main{flex:0 0 auto;min-height:0;padding:0 22px 22px}
  #doc{height:auto;min-height:calc(100dvh - 190px);padding-top:22px;display:flex;flex-direction:column;gap:18px;overflow:visible}
  #doc .scene{height:auto;min-height:0;display:grid;grid-template-columns:1fr;gap:16px}
  #doc .scene-card{height:auto;min-height:260px}
  #doc .scene-visual-card{height:clamp(250px,48vh,380px)}
  #doc .scene-content-card{min-height:280px}
}
</style>
<style>
/* Estado activo de la navegación: indicador permanente de ubicación. */
header nav button.nav-selected{background:var(--mint);color:#102a22;border-color:var(--mint);box-shadow:0 0 0 3px #b9dc8240,0 0 18px #b9dc8266}
header nav button.nav-selected:hover{background:#d7f39b;color:#102a22}
</style>
<style>
/* Ajustes exclusivos para teléfonos: el diseño de escritorio permanece intacto. */
@media (max-width:700px){
  html,body{height:auto;min-height:100%;}
  body{min-height:100dvh;overflow-x:hidden;overflow-y:auto;}
  main{flex:0 0 auto;min-height:0;padding:0 14px 24px;}
  header{padding:14px;gap:10px;}
  header strong{font-size:clamp(.95rem,4.2vw,1.15rem);}
  nav{width:100%;gap:8px;}
  nav button{flex:1 1 auto;min-width:0;padding:10px 9px;font-size:.88rem;}
  #home{width:100%;}
  .hero{padding:26px 0 34px;gap:18px;}
  .hero-art img{width:min(100%,360px);max-width:100%;}
  #doc{height:auto;min-height:0;padding:22px 0 0;overflow:visible;}
  #doc .scene{height:auto;min-height:0;grid-template-columns:1fr;overflow:visible;}
  #doc .scene-card{height:auto;min-height:0;}
  #doc .scene-visual-card{height:clamp(230px,48dvh,360px);}
  #doc .scene-content-card{min-height:0;padding:20px 16px;}
  #doc .scene-content-card .controls{margin-top:18px;}
  #doc .scene-content-card .controls button{flex:1 1 130px;}
  #game{height:auto;min-height:0;overflow:visible;padding:0;}
  #gameFrame{width:100%;height:max(720px,calc(100dvh - 110px));min-height:720px;border-radius:14px;overflow:visible;}
}
</style>
</head>
<body><header><strong>🌿 GUARDIANES DE LA SELVA</strong><nav><button class="secondary nav-selected" onclick="show('home');selectNav(this)">Inicio</button><button class="secondary" onclick="show('doc');selectNav(this)">Documental</button><button class="secondary" onclick="window.location.href='juego.html'">Juego</button></nav></header><main>
<section id="home"><div class="hero"><div><h1>Los héroes que vuelan de noche</h1><p>Cuando cae la noche, unos héroes salen para ayudar a mantener viva la selva. Descubramos qué es lo que nos tiene guardado la naturaleza.</p><div class="controls"><button onclick="show('doc')">Comenzar documental</button><button class="secondary" onclick="startGame()">Ir al juego</button></div></div><div class="hero-art"><img src="isla.webp" alt="Isla con un árbol iluminada sobre un fondo natural"></div></div></section>
<section id="doc" class="hidden"><h2>Una noche en la selva</h2><div class="progress" aria-label="Progreso del documental"><div id="bar"></div></div><div class="scene" id="scenePanel" aria-live="polite"><div class="scene-card scene-visual-card"><div class="visual" aria-hidden="true"><video class="scene-video" id="sceneVideo" autoplay muted loop playsinline preload="none" tabindex="-1" aria-label="Video de la escena del documental"><source src="01.mp4" type="video/mp4"></video><img class="scene-image hidden" id="sceneImage" loading="lazy" alt="Ilustración de la escena del documental"></div></div><div class="scene-card scene-content-card"><h2 id="sceneTitle"></h2><p id="sceneText"></p><div class="fact" id="sceneFact"></div><div class="controls"><button class="secondary" id="prev" onclick="move(-1)">Anterior</button><button id="next" onclick="move(1)">Siguiente</button><button class="secondary" id="narrate" onclick="speak()">▶ Reproducir</button></div></div></div></section>
<section id="game" class="hidden"><iframe id="gameFrame" src="juego.html" title="Juego del murciélago"></iframe></section></main>
<script>
const scenes=[{title:'La selva despierta de noche',text:'Mientras muchos animales descansan, distintos murciélagos salen a buscar alimento. Algunas especies visitan frutos; otras, flores que abren durante la noche.',fact:'',audio:'01.mp3'},{title:'Eligen un fruto maduro',text:'Un murciélago frugívoro localiza frutos mediante sus sentidos. Al alimentarse, puede transportar semillas lejos de la planta que produjo el fruto.',fact:'',audio:'02.mp3'},{title:'Un viaje lejos del árbol',text:'Algunos murciélagos llevan los frutos hasta lugares donde se posan para comer, llamados perchas de alimentación. Allí pueden dejar caer semillas o restos del fruto.',fact:'',audio:'03.mp3'},{title:'La semilla tiene otra oportunidad',text:'Las semillas también pueden dispersarse a través de las heces. Si llegan a un sitio adecuado y sobreviven, pueden germinar y convertirse en nuevas plantas.',fact:'',audio:'04.mp3'},{title:'Las flores también reciben visitas',text:'Algunos murciélagos buscan néctar. Al acercarse a las flores, pueden transportar polen entre ellas y favorecer su reproducción.',fact:'',audio:'05.mp3'},{title:'Una selva conectada',text:'La relación entre los murciélagos y las plantas es un ejemplo de mutualismo por dispersión de semillas. Los murciélagos obtienen alimento al consumir frutos y, a cambio, ayudan a dispersar las semillas, permitiendo que nuevas plantas crezcan en diferentes lugares de la selva. Así, ambos se benefician y contribuyen a mantener la diversidad del ecosistema.',fact:'',audio:'06.mp3'}];
let scene=0,locked=false;const $=id=>document.getElementById(id);const narrationAudio=new Audio();narrationAudio.preload='none';narrationAudio.addEventListener('ended',()=>{narrationAudio.currentTime=0;setNarrationButton('ready')});narrationAudio.addEventListener('error',()=>setNarrationButton('ready'));
function selectNav(button){document.querySelectorAll('nav button').forEach(item=>item.classList.remove('nav-selected'));button.classList.add('nav-selected')}function setNarrationButton(state){let b=$('narrate');if(!b)return;let playing=state==='playing';b.textContent=playing?'⏸ Pausar':state==='paused'?'▶ Reanudar':'▶ Reproducir';b.classList.toggle('is-active',playing)}function stopNarration(){narrationAudio.pause();narrationAudio.currentTime=0;setNarrationButton('ready')}function show(id){stopNarration();['home','doc','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='doc')renderScene();window.scrollTo({top:0,behavior:'smooth'})}function setControlsDisabled(v){['prev','next','narrate'].forEach(id=>$(id).disabled=v);if(!v){$('prev').disabled=scene===0;$('next').disabled=scene===scenes.length-1}}function applyScene(){let s=scenes[scene];narrationAudio.src=s.audio;narrationAudio.load();const video=$('sceneVideo'),image=$('sceneImage'),isVideo=scene===0||scene===2||scene===3;video.classList.toggle('hidden',!isVideo);image.classList.toggle('hidden',isVideo);image.src=`${scene+1}.webp`;if(isVideo){const source=video.querySelector('source'),videoFile=scene===0?'01.mp4':scene===2?'03.mp4':'04.mp4';if(source.getAttribute('src')!==videoFile){source.src=videoFile;video.load()}video.play().catch(()=>{})}else{video.pause()}$('sceneTitle').textContent=s.title;$('sceneText').textContent=s.text;$('sceneFact').textContent=s.fact?'💡 '+s.fact:'';$('sceneFact').style.display=s.fact?'block':'none';$('bar').style.width=(scene+1)/scenes.length*100+'%';$('prev').disabled=scene===0;$('next').style.display=scene===scenes.length-1?'none':'inline-block'}function renderScene(direction=0){if(locked)return;stopNarration();if(!direction){applyScene();return}let p=$('scenePanel');locked=true;setControlsDisabled(true);p.className='scene is-leaving '+(direction>0?'direction-next':'direction-prev');setTimeout(()=>{applyScene();p.className='scene is-entering '+(direction>0?'direction-next':'direction-prev');setTimeout(()=>{p.className='scene';locked=false;setControlsDisabled(false)},260)},260)}function move(n){if(locked)return;if(scene===scenes.length-1&&n===1){startGame();return}let next=Math.max(0,Math.min(scenes.length-1,scene+n));if(next===scene)return;scene=next;renderScene(n)}function speak(){if(locked||!narrationAudio.src)return;if(!narrationAudio.paused){narrationAudio.pause();setNarrationButton('paused');return}setNarrationButton('playing');let p=narrationAudio.play();if(p)p.catch(()=>setNarrationButton('ready'))}function startGame(){window.location.href='juego.html'}
function setActiveNav(section){const buttons=document.querySelectorAll('header nav button');const names=['home','doc','game'];buttons.forEach((button,index)=>button.classList.toggle('nav-selected',names[index]===section))}
function show(id){stopNarration();['home','doc','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id));setActiveNav(id);if(id==='doc')renderScene();window.scrollTo({top:0,behavior:'smooth'})}
function syncActiveNav(){setActiveNav(location.hash==='#doc'?'doc':'home')}
window.addEventListener('hashchange',syncActiveNav);
if(location.hash==='#doc')show('doc');else syncActiveNav();
</script></body></html>
